{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash of Clans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'style.css' %}">
    
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Navbar</a>
          
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">About</a>
              </li>
              <!-- Link to a general news page -->
              
            </ul>
            <form class="d-flex" role="search" action="#">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
          </div>
        </div>
    </nav>
    <strong>Our News</strong>
    {% block content %}
      {% for i in news %}
      <img src="{%static 'C:\Users\HP\Desktop\portal\static\dragon-removebg-preview.png'%}">
        <h1>{{ i.title }}</h1>
        <h1 class="badge bg-danger p-2 m-2">{{ i.title }}</h1>
        <br>
        {% if i.image %}
        <img src="{{i.image.url}}" alt="dragon" height="180" width="180">
        {% endif %}
        <h1>Hello</h1>
        <span class="badge bg-danger">{{ i.category }}</span><br>
        <span class="text-danger">{{ i.description }}</span>
        <a class="p-2 m-2 text-light" href="{% url 'portalApp:news_detail' i.id %}" class="btn btn-primary mt-3">Read More</a>
      {% endfor %}
    {% endblock content %}
</body>
</html>
